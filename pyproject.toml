[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "epiduo"
version = "0.1.0"
description = "Two epigenome-informed virtual cell models (Epi-GRN and Epi-Direct) benchmarked against STATE with cell-eval"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "h5py",
    "anndata",
    "scanpy",
    "torch>=2.4",
]

[project.optional-dependencies]
eval = ["cell-eval>=0.8", "polars"]
state = ["arc-state>=0.11"]

[project.scripts]
epiduo = "epiduo.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/epiduo"]

[tool.ruff]
line-length = 120
